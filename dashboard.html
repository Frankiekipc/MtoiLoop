<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - Mtoi Loop</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="dashboard-layout">
        <div class="sidebar">
            <h2>Mtoi Loop</h2>
            <a href="#" class="active">🏠 Dashboard</a>
            <a href="#">📍 Bus Tracker</a>
            <a href="#">🥗 Meals</a>
            <button class="logout" onclick="location.href='login.html'">Logout</button>
        </div>
        <div class="main-content">
            <h1>Hello, Jane Maina!</h1>
            <div class="stats-grid">
                <div class="card"><b>Status</b>
                    <p>In Class</p>
                </div>
                <div class="card"><b>Bus</b>
                    <p>At School</p>
                </div>
                <div class="card"><b>Lunch</b>
                    <p>Finished</p>
                </div>
                <div class="card"><b>Pick Up</b>
                    <p>4:30 PM</p>
                </div>
            </div>
            <div class="child-profile">
                <div class="avatar-circle">K</div>
                <div>
                    <h2>Tevin Maina</h2>
                    <p>PP2 Blue • School: Westview Acad.</p>
                    <span class="status-tag">● Checked In: 7:45 AM</span>
                    <div class="action-group">
                        <button class="btn-small btn-teal">Track Bus</button>
                        <button class="btn-small btn-gray">Message Teacher</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
