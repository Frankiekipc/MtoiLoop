<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Join - Mtoi Loop</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Create Account</h2>
            <form onsubmit="event.preventDefault(); window.location.href='login.html';">
                <div class="form-group"><label>Full Name</label><input type="text" required></div>
                <div class="form-group"><label>Child's Name</label><input type="text" required></div>
                <div class="form-group"><label>Grade</label>
                    <select><option>PP1</option><option>PP2</option><option>Grade 1</option></select>
                </div>
                <button type="submit" class="btn-yellow">Join the Loop</button>
            </form>
        </div>
    </div>
</body>

</html>
